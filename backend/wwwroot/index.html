<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ESP32 · BLE</title>
<style>
body{font:16px Arial,sans-serif;max-width:760px;margin:35px auto;padding:0 20px;color:#fff;background:#000}
button,select{font:inherit;padding:8px;margin:6px 8px 6px 0;color:#000;background:#fff;border:2px outset #fff;border-radius:0}
button:disabled{color:#666;background:#ddd}section{padding:18px 0;border-top:1px solid #fff;margin-top:20px}
pre{white-space:pre-wrap;overflow-wrap:anywhere}progress{width:100%;accent-color:#fff}small,.error,#error{color:#fff}#socket{display:block;min-height:1.2em}h2{font-size:20px;min-height:1.2em}a{color:#fff}
</style>
<h1>ESP32 · BLE / ESP-IDF</h1><small id="socket"></small>
<section><h2 id="state"></h2><button data-action="connect">Połącz</button><button data-action="disconnect">Rozłącz</button><button data-action="ping">Ping</button><p id="ping">Ping uruchamia się tylko po kliknięciu.</p><p id="error" class="error"></p><small>Ostatni odczyt firmware</small><pre id="device"></pre></section>
<section><h2>Firmware</h2><select id="ports"></select><button id="usb">Kompiluj i wgraj przez USB</button><button id="ota">Kompiluj i wgraj przez BLE OTA</button><button data-action="cancel">Anuluj</button><p id="stage">—</p><progress id="progress" max="100" value="0"></progress><pre id="result"></pre></section>
<script>
let ws,busy=false,live=false,connected=false,reconnect;
const $=id=>document.getElementById(id);
function buttons(){document.querySelectorAll('button[data-action]').forEach(b=>{const a=b.dataset.action;b.disabled=!live||(a==='cancel'?!busy:busy||(a==='ping'&&!connected));});$('usb').disabled=$('ota').disabled=!live||busy;}
const connectionLabels = {
    unknown: 'Łączenie…', scanning: 'Łączenie…', connecting: 'Łączenie…',
    disconnected: 'Rozłączony', connected: 'Połączony', error: 'Błąd połączenia'
};
const storageKey = 'ble.lastConnectionState';
let lastConnectionState = null;
let waitingForState = true;
let pendingConnection = null;
let initialStateTimer = null;
try {
    const saved = localStorage.getItem(storageKey);
    if (saved === 'connected' || saved === 'disconnected') lastConnectionState = saved;
} catch { /* Browser storage may be disabled. Live state still works. */ }

function showState(state) {
    const label = connectionLabels[state] || state;
    if ($('state').textContent !== label) $('state').textContent = label;
}
function showLastKnownState() {
    showState(lastConnectionState || 'unknown');
    $('socket').textContent = lastConnectionState
        ? 'Ostatnio znany stan — weryfikacja…'
        : 'Łączenie z aplikacją…';
}
function rememberState(state) {
    if (state !== 'connected' && state !== 'disconnected') return;
    if (lastConnectionState === state) return;
    lastConnectionState = state;
    try { localStorage.setItem(storageKey, state); }
    catch { /* Browser storage may be disabled. Live state still works. */ }
}
function applyConnection(c) {
    live = true;
    connected = c.connected;
    showState(c.state === 'unknown' && c.discovery === 'unavailable'
        ? 'Stan BLE nieznany' : c.state);
    rememberState(c.state);
    const message = 'Połączenie z aplikacją aktywne';
    if ($('socket').textContent !== message) $('socket').textContent = message;
    buttons();
}

function receiveConnection(c) {
    if (!waitingForState) {
        applyConnection(c);
        return;
    }
    const stateChanged = pendingConnection?.state !== c.state;
    pendingConnection = c;
    const settling = c.state === 'unknown' || c.state === 'scanning' || c.state === 'connecting';
    if (settling && c.discovery !== 'unavailable') {
        clearTimeout(initialStateTimer);
        initialStateTimer = null;
        return;
    }
    // Coalesce the first burst of snapshots; never delay later connection loss.
    if (initialStateTimer !== null && !stateChanged) return;
    clearTimeout(initialStateTimer);
    initialStateTimer = setTimeout(() => {
        waitingForState = false;
        initialStateTimer = null;
        applyConnection(pendingConnection);
    }, 300);
}
showLastKnownState();

function open() {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    ws.onclose = () => {
        live = false;
        connected = false;
        waitingForState = true;
        pendingConnection = null;
        clearTimeout(initialStateTimer);
        initialStateTimer = null;
        showLastKnownState();
        $('socket').textContent = lastConnectionState
            ? 'Brak połączenia z aplikacją — pokazano ostatnio znany stan'
            : 'Brak połączenia z aplikacją — stan urządzenia nieznany';
        buttons();
        reconnect = setTimeout(open, 1000);
    };
    ws.onmessage = e => {
        const s = JSON.parse(e.data);
        if (s.type !== 'state') return;
        const c = s.connection, f = s.firmware;
        busy = f.busy;
        receiveConnection(c);
        $('error').textContent = f.error || c.error || '';
        if (c.last_ping) $('ping').textContent = c.last_ping.ok
            ? `Ostatni ping: ${c.last_ping.reply} · ${c.last_ping.rtt_ms} ms` : c.last_ping.error;
        $('device').textContent = c.device ? JSON.stringify(c.device, null, 2) : '';
        $('stage').textContent = f.stage;
        $('progress').value = f.progress || 0;
        $('result').textContent = f.result ? JSON.stringify(f.result, null, 2) : '';
        buttons();
    };
}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({action:b.dataset.action}));});
async function upload(transport){if(!window.confirm('Czy ESP32 jest podłączone tylko przez USB, a ATX i przewody rejestrów/napędów są odłączone?'))return;try{const r=await fetch(`/api/firmware/${transport}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({isolatedHardwareConfirmed:true,port:$('ports').value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Upload failed');}catch(e){$('error').textContent=e.message;}}
$('usb').onclick=()=>upload('usb');$('ota').onclick=()=>upload('ota');
fetch('/api/firmware/ports').then(r=>r.json()).then(ports=>{for(const p of ports){const o=document.createElement('option');o.value=p.port;o.textContent=p.port;$('ports').append(o);}}).catch(e=>$('error').textContent=e.message);
buttons();open();
</script></html>
